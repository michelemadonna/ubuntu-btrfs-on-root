DISTRO_ID="ubuntu"

ESP_DIR="/boot/efi"
UKI_RELATIVE_DIR="EFI/Linux/${DISTRO_ID}"
UKI_PREFIX="${DISTRO_ID}"
KEEP_UKIS="2"

CMDLINE_FILE="/etc/kernel/cmdline"
UKIFY_CONFIG="/etc/kernel/uki.conf"

# Keep these keys shared between Ubuntu and Kali when both systems must unlock
# the same LUKS volume through the same signed PCR 11 policy.
PCR_PRIVATE_KEY="/etc/uki/keys/pcr-private.pem"
PCR_PUBLIC_KEY="/etc/uki/keys/pcr-public.pem"

SNAPSHOT_MODULE_DIR="/usr/lib/dracut/modules.d/92snapshot-menu"
LOCK_FILE="/run/lock/${DISTRO_ID}-uki.lock"