SNAPPER_CONFIG="root"
NORMAL_ROOT_SUBVOL="@ubuntu"
SNAPSHOT_DIRECTORY=".snapshots"

# Detection time in deciseconds. 20 = 2 seconds.
KEY_TIMEOUT_DS="20"

# Leave empty to resolve the root device from root=.
ROOT_DEVICE=""

# yes: block snapshots without the current UKI kernel modules.
# no: display a warning and allow boot.
REQUIRE_MATCHING_KERNEL="no"

MAX_SNAPSHOTS="100"
NEWEST_FIRST="yes"

MENU_TTY="/dev/tty1"
MENU_VT="1"
PLYMOUTH_INTEGRATION="yes"